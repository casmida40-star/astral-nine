name: Probe Astral Site Git

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe internal project repository
        shell: bash
        run: |
          set +e
          mkdir -p probe
          URL='https://git.chatgpt-team.site/f5dc2367-8301-43e0-9cd8-923c35c21568/appgprj_6aaf43d84a3c819181fa786489e04d34.git'
          echo "$URL" > probe/url.txt
          GIT_CURL_VERBOSE=1 git ls-remote "$URL" > probe/ls-remote.txt 2> probe/ls-remote.err
          echo $? > probe/ls-remote.exit
          curl -IL --max-time 30 "$URL/info/refs?service=git-upload-pack" > probe/curl.txt 2> probe/curl.err
          echo $? > probe/curl.exit
          cat probe/ls-remote.exit probe/ls-remote.txt probe/ls-remote.err
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: Astral-Site-Git-Probe
          path: probe/
          retention-days: 2
